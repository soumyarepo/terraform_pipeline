name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.terraform-version'
      - '.github/workflows/terraform-plan.yml'
      - 'scripts/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  plan:
    name: Validate and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      - name: Verify Terraform files
        shell: bash
        run: |
          set -euo pipefail
          if ! find ../.. -type f -name '*.tf' -not -path '*/.terraform/*' | grep -q .; then
            echo "::error::No Terraform configuration files (*.tf) found."
            exit 1
          fi
          echo "Terraform configuration files found."

      - name: Configure AWS credentials
        if: ${{ vars.TERRAFORM_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Format Check
        working-directory: .
        run: |
          set -o pipefail
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Convert plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Generate plan summary
        run: python ../../scripts/terraform-plan-summary.py tfplan.json > plan-summary.md

      - name: Publish plan summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('environments/dev/plan-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.pull_request.number }}
          path: |
            environments/dev/tfplan
            environments/dev/tfplan.json
            environments/dev/plan-summary.md
            environments/dev/.terraform.lock.hcl
