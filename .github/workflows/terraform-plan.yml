name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "scripts/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Terraform source code
        uses: actions/checkout@v4

      # ============================================================
      # DEBUG GITHUB CONTEXT
      # ============================================================

      - name: Debug GitHub context
        shell: bash
        run: |
          echo "========================================"
          echo "GitHub Context"
          echo "========================================"
          echo "Repository       : $GITHUB_REPOSITORY"
          echo "Workflow         : $GITHUB_WORKFLOW"
          echo "Event Name       : $GITHUB_EVENT_NAME"
          echo "Ref              : $GITHUB_REF"
          echo "SHA              : $GITHUB_SHA"
          echo "Actor            : $GITHUB_ACTOR"
          echo "Workspace        : $GITHUB_WORKSPACE"
          echo "AWS Region       : $AWS_REGION"
          echo "========================================"

      # ============================================================
      # DEBUG REPOSITORY FILES
      # ============================================================

      - name: Debug repository files
        shell: bash
        run: |
          echo "========================================"
          echo "Current Directory"
          echo "========================================"

          pwd

          echo ""
          echo "========================================"
          echo "Repository Files"
          echo "========================================"

          find . -maxdepth 3 -type f | sort

      # ============================================================
      # VERIFY TERRAFORM FILES
      # ============================================================

      - name: Verify Terraform configuration files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for Terraform files"
          echo "========================================"

          find . \
            -type f \
            -name "*.tf" \
            -not -path "*/.terraform/*" \
            -print

          if ! find . \
            -type f \
            -name "*.tf" \
            -not -path "*/.terraform/*" \
            | grep -q .; then

            echo "::error::No Terraform configuration files (*.tf) were found."
            exit 1
          fi

          echo ""
          echo "Terraform configuration files found successfully."

      # ============================================================
      # SETUP TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      - name: Verify Terraform installation
        shell: bash
        run: |
          echo "========================================"
          echo "Terraform Version"
          echo "========================================"

          terraform version

      # ============================================================
      # DEBUG GITHUB OIDC CLAIMS
      # ============================================================

      - name: Debug GitHub OIDC Claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64'
              ).toString()
            );

            console.log("========================================");
            console.log("GitHub OIDC Claims");
            console.log("========================================");
            console.log("Audience     :", payload.aud);
            console.log("Subject      :", payload.sub);
            console.log("Repository   :", payload.repository);
            console.log("Ref          :", payload.ref);
            console.log("Ref Type     :", payload.ref_type);
            console.log("Event Name   :", payload.event_name);
            console.log("Actor        :", payload.actor);
            console.log("Environment  :", payload.environment);
            console.log("Workflow     :", payload.workflow);
            console.log("========================================");

      # ============================================================
      # VERIFY REQUIRED GITHUB VARIABLES
      # ============================================================

      - name: Verify required GitHub variables
        shell: bash
        env:
          PLAN_ROLE_ARN: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GitHub Actions Variables"
          echo "========================================"

          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::TERRAFORM_PLAN_ROLE_ARN is not configured."
            exit 1
          fi

          if [ -z "$STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET is not configured."
            exit 1
          fi

          echo "TERRAFORM_PLAN_ROLE_ARN : $PLAN_ROLE_ARN"
          echo "TF_STATE_BUCKET         : $STATE_BUCKET"
          echo "AWS_REGION              : $AWS_REGION"
          echo "========================================"

      # ============================================================
      # CONFIGURE AWS OIDC
      # ============================================================

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      # ============================================================
      # VERIFY AWS IDENTITY
      # ============================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS Caller Identity"
          echo "========================================"

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"

          aws configure get region || true

      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Init"
          echo "========================================"
          echo "Backend bucket : ${{ vars.TF_STATE_BUCKET }}"
          echo "Backend key    : prod/terraform.tfstate"
          echo "AWS region     : ${{ env.AWS_REGION }}"
          echo "========================================"

          terraform init \
            -upgrade \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            2>&1 | tee terraform-init.log

      # ============================================================
      # TERRAFORM FORMAT
      # ============================================================

      - name: Terraform Format
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Format Check"
          echo "========================================"

          terraform fmt \
            -check \
            -recursive \
            -diff \
            2>&1 | tee terraform-fmt.log

      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================

      - name: Terraform Validate
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Validate"
          echo "========================================"

          terraform validate \
            -no-color \
            2>&1 | tee terraform-validate.log

      # ============================================================
      # TFLINT
      # ============================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Verify TFLint installation
        shell: bash
        run: |
          echo "========================================"
          echo "TFLint Version"
          echo "========================================"

          tflint --version

      - name: Initialize TFLint
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Initializing TFLint"
          echo "========================================"

          tflint --init

      - name: Run TFLint and generate JSON report
        id: tflint
        shell: bash
        run: |
          echo "========================================"
          echo "Running TFLint"
          echo "========================================"

          set +e

          tflint \
            --recursive \
            --format json \
            > tflint-results.json \
            2> tflint-error.log

          TFLINT_EXIT_CODE=$?

          set -e

          echo ""
          echo "TFLint exit code: $TFLINT_EXIT_CODE"

          if [ ! -s "tflint-results.json" ]; then
            echo "::error::TFLint JSON report is empty or was not generated."

            if [ -f "tflint-error.log" ]; then
              echo ""
              echo "TFLint Error Output"
              echo "----------------------------------------"
              cat tflint-error.log
            fi

            exit 1
          fi

          echo ""
          echo "TFLint JSON report generated successfully."

          ls -lh tflint-results.json

          echo "exit_code=$TFLINT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Do not fail yet.
          # Generate human-readable report first.
          exit 0

      # ============================================================
      # VERIFY TFLINT SUMMARY SCRIPT
      # ============================================================

      - name: Verify TFLint summary script
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "scripts/tflint-summary.py" ]; then
            echo "::error::scripts/tflint-summary.py was not found."

            echo ""
            echo "Available scripts:"

            find scripts \
              -maxdepth 2 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "TFLint summary script found."

      # ============================================================
      # GENERATE TFLINT REPORTS
      # ============================================================

      - name: Generate TFLint reports
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generating TFLint Reports"
          echo "========================================"

          python scripts/tflint-summary.py \
            tflint-results.json \
            tflint-summary.md \
            tflint-summary.html

          echo ""
          echo "Generated reports:"
          echo "----------------------------------------"

          ls -lh \
            tflint-results.json \
            tflint-summary.md \
            tflint-summary.html

      # ============================================================
      # ADD TFLINT REPORT TO GITHUB SUMMARY
      # ============================================================

      - name: Add TFLint report to GitHub job summary
        shell: bash
        run: |
          echo "## 🔍 Terraform TFLint Quality Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          cat tflint-summary.md >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # CHECKOV SECURITY SCAN
      # ============================================================

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing Checkov"
          echo "========================================"

          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov Terraform Security Scan
        id: checkov
        shell: bash
        run: |
          echo "========================================"
          echo "Running Checkov"
          echo "========================================"

          set +e

          checkov \
            -d . \
            --framework terraform \
            --compact \
            2>&1 | tee checkov-results.log

          CHECKOV_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Checkov exit code: $CHECKOV_EXIT_CODE"

          echo "exit_code=$CHECKOV_EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Do not fail here.
          # Continue so Terraform plan and summary are generated.
          exit 0

      # ============================================================
      # ADD CHECKOV SUMMARY
      # ============================================================

      - name: Add Checkov result to GitHub job summary
        shell: bash
        run: |
          echo "## 🛡️ Checkov Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.checkov.outputs.exit_code }}" = "0" ]; then
            echo "✅ **Status:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Status:** SECURITY FINDINGS DETECTED" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed Checkov output is available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # VERIFY TFVARS
      # ============================================================

      - name: Verify production tfvars
        shell: bash
        run: |
          set -euo pipefail

          TFVARS_FILE="environments/prod/terraform.tfvars"

          echo "========================================"
          echo "Checking Terraform Variables File"
          echo "========================================"
          echo "Expected file: $TFVARS_FILE"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "::error::Terraform tfvars file not found: $TFVARS_FILE"

            echo ""
            echo "Available .tfvars files:"

            find . \
              -type f \
              -name "*.tfvars" \
              -not -path "*/.terraform/*" \
              -print

            exit 1
          fi

          echo ""
          echo "Found: $TFVARS_FILE"

      # ============================================================
      # TERRAFORM PLAN
      # ============================================================

      - name: Terraform Plan
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Plan"
          echo "========================================"
          echo "Variable file : environments/prod/terraform.tfvars"
          echo "Plan output   : tfplan"
          echo "========================================"

          terraform plan \
            -var-file="environments/prod/terraform.tfvars" \
            -out="tfplan" \
            -no-color \
            2>&1 | tee terraform-plan.log

      # ============================================================
      # VERIFY TERRAFORM PLAN
      # ============================================================

      - name: Verify Terraform plan file
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Plan File"
          echo "========================================"

          if [ ! -f "tfplan" ]; then
            echo "::error::tfplan was not generated."
            exit 1
          fi

          ls -lh tfplan

          echo ""
          echo "Terraform plan created successfully."

      # ============================================================
      # CONVERT TERRAFORM PLAN TO JSON
      # ============================================================

      - name: Convert plan to JSON
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Converting Terraform Plan to JSON"
          echo "========================================"

          terraform show \
            -json tfplan \
            > tfplan.json

          if [ ! -s "tfplan.json" ]; then
            echo "::error::Terraform plan JSON was not generated."
            exit 1
          fi

          ls -lh tfplan.json

      # ============================================================
      # VERIFY PYTHON SUMMARY SCRIPT
      # ============================================================

      - name: Verify Python and Terraform plan summary script
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Python Environment"
          echo "========================================"

          python --version

          echo ""
          echo "Checking Terraform plan summary script..."

          if [ ! -f "scripts/terraform-plan-summary.py" ]; then
            echo "::error::scripts/terraform-plan-summary.py was not found."

            echo ""
            echo "Scripts directory:"

            find scripts \
              -maxdepth 2 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Terraform plan summary script found."

      # ============================================================
      # GENERATE TERRAFORM PLAN TABLE
      # ============================================================

      - name: Generate Terraform plan table
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generating Terraform Plan Summary"
          echo "========================================"

          python scripts/terraform-plan-summary.py \
            tfplan.json \
            > terraform-plan-summary.md

          if [ ! -s "terraform-plan-summary.md" ]; then
            echo "::error::Terraform plan summary was not generated."
            exit 1
          fi

          echo ""
          echo "Generated Terraform Plan Summary:"
          echo "----------------------------------------"

          cat terraform-plan-summary.md

      # ============================================================
      # ADD TERRAFORM PLAN TO GITHUB SUMMARY
      # ============================================================

      - name: Add Terraform plan table to job summary
        shell: bash
        run: |
          echo "## 📋 Terraform Plan Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          cat terraform-plan-summary.md >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # POST TERRAFORM PLAN TO PULL REQUEST
      # ============================================================

      - name: Post Terraform plan table to Pull Request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");

            const body = fs.readFileSync(
              "terraform-plan-summary.md",
              "utf8"
            );

            console.log("Posting Terraform plan summary to PR...");
            console.log("PR Number:", context.issue.number);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            console.log(
              "Terraform plan summary posted successfully."
            );

      # ============================================================
      # POST TFLINT REPORT TO PULL REQUEST
      # ============================================================

      - name: Post TFLint summary to Pull Request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");

            const body = fs.readFileSync(
              "tflint-summary.md",
              "utf8"
            );

            const commentBody = `
            ## 🔍 Terraform TFLint Quality Report

            ${body}
            `;

            console.log("Posting TFLint summary to PR...");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            console.log(
              "TFLint summary posted successfully."
            );

      # ============================================================
      # FINAL PIPELINE SUMMARY
      # ============================================================

      - name: Add final pipeline status
        if: always()
        shell: bash
        run: |
          echo "## 🚀 Terraform CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Validation | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Terraform Format | Completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Validate | Completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TFLint | Exit Code: ${{ steps.tflint.outputs.exit_code }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checkov | Exit Code: ${{ steps.checkov.outputs.exit_code }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Plan | Completed |" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # UPLOAD REPORTS / DEBUG ARTIFACTS
      # ============================================================

      - name: Upload Terraform plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}
          path: |
            terraform-init.log
            terraform-fmt.log
            terraform-validate.log
            terraform-plan.log
            tfplan.json
            terraform-plan-summary.md
            tflint-results.json
            tflint-error.log
            tflint-summary.md
            tflint-summary.html
            checkov-results.log
          if-no-files-found: warn