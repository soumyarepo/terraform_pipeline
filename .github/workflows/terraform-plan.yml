name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "scripts/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Terraform source code
        uses: actions/checkout@v4

      - name: Verify Terraform configuration files
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -type f -name "*.tf" -not -path "*/.terraform/*" | grep -q .; then
            echo "::error::No Terraform configuration files (*.tf) were found."
            exit 1
          fi
          echo "Terraform configuration files found."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        shell: bash
        run: |
          set -o pipefail
          terraform init -upgrade \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" 2>&1 | tee terraform-init.log

      - name: Terraform Format
        shell: bash
        run: |
          set -o pipefail
          terraform fmt -check -recursive 2>&1 | tee terraform-fmt.log

      - name: Terraform Validate
        shell: bash
        run: |
          set -o pipefail
          terraform validate -no-color 2>&1 | tee terraform-validate.log

      - name: Terraform Plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan \
            -var-file=environments/prod/terraform.tfvars \
            -out=tfplan -no-color 2>&1 | tee terraform-plan.log

      - name: Convert plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Generate plan table
        run: python scripts/terraform-plan-summary.py tfplan.json > terraform-plan-summary.md

      - name: Add plan table to job summary
        run: cat terraform-plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan table to Pull Request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("terraform-plan-summary.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}
          path: |
            tfplan.json
            terraform-plan-summary.md
