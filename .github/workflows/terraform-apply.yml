name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "scripts/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:

  # ============================================================
  # JOB 1
  # CREATE FINAL PRODUCTION PLAN
  # ============================================================

  prepare-plan:
    name: Prepare Production Plan
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout merged code
        uses: actions/checkout@v4

      # ============================================================
      # GITHUB CONTEXT
      # ============================================================

      - name: Show deployment context
        shell: bash
        run: |
          echo "========================================"
          echo "Terraform Production Deployment"
          echo "========================================"
          echo "Repository       : $GITHUB_REPOSITORY"
          echo "Workflow         : $GITHUB_WORKFLOW"
          echo "Event            : $GITHUB_EVENT_NAME"
          echo "Branch           : $GITHUB_REF_NAME"
          echo "Commit SHA       : $GITHUB_SHA"
          echo "Triggered By     : $GITHUB_ACTOR"
          echo "Run ID           : $GITHUB_RUN_ID"
          echo "AWS Region       : $AWS_REGION"
          echo "========================================"

      # ============================================================
      # VERIFY TERRAFORM FILES
      # ============================================================

      - name: Verify Terraform configuration files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Terraform Configuration"
          echo "========================================"

          find . \
            -type f \
            -name "*.tf" \
            -not -path "*/.terraform/*" \
            -print

          if ! find . \
            -type f \
            -name "*.tf" \
            -not -path "*/.terraform/*" \
            | grep -q .; then

            echo "::error::No Terraform configuration files found."
            exit 1
          fi

          echo ""
          echo "Terraform configuration found successfully."

      # ============================================================
      # SETUP TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      - name: Verify Terraform installation
        shell: bash
        run: |
          echo "========================================"
          echo "Terraform Version"
          echo "========================================"

          terraform version

      # ============================================================
      # VERIFY REQUIRED VARIABLES
      # ============================================================

      - name: Verify required GitHub variables
        shell: bash
        env:
          PLAN_ROLE_ARN: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Required GitHub Variables"
          echo "========================================"

          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::TERRAFORM_PLAN_ROLE_ARN is not configured."
            exit 1
          fi

          if [ -z "$STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET is not configured."
            exit 1
          fi

          echo "TERRAFORM_PLAN_ROLE_ARN configured."
          echo "TF_STATE_BUCKET configured."
          echo "AWS_REGION : $AWS_REGION"

      # ============================================================
      # AWS OIDC - PLAN ROLE
      # ============================================================

      - name: Configure AWS credentials for Terraform Plan
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-prod-plan-${{ github.run_id }}

      # ============================================================
      # VERIFY AWS IDENTITY
      # ============================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS Caller Identity"
          echo "========================================"

          aws sts get-caller-identity

      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Init"
          echo "========================================"
          echo "Backend bucket : ${{ vars.TF_STATE_BUCKET }}"
          echo "Backend key    : prod/terraform.tfstate"
          echo "AWS region     : ${{ env.AWS_REGION }}"
          echo "========================================"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            2>&1 | tee terraform-init.log

      # ============================================================
      # TERRAFORM VALIDATE
      # Lightweight safety validation before production planning.
      # TFLint and Checkov already ran in PR pipeline.
      # ============================================================

      - name: Terraform Validate
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Validate"
          echo "========================================"

          terraform validate \
            -no-color \
            2>&1 | tee terraform-validate.log

      # ============================================================
      # VERIFY PRODUCTION TFVARS
      # ============================================================

      - name: Verify production tfvars
        shell: bash
        run: |
          set -euo pipefail

          TFVARS_FILE="environments/prod/terraform.tfvars"

          echo "========================================"
          echo "Production Variables File"
          echo "========================================"
          echo "Expected file: $TFVARS_FILE"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "::error::Terraform tfvars file not found: $TFVARS_FILE"

            echo ""
            echo "Available tfvars files:"

            find . \
              -type f \
              -name "*.tfvars" \
              -not -path "*/.terraform/*" \
              -print

            exit 1
          fi

          echo ""
          echo "Found: $TFVARS_FILE"

      # ============================================================
      # CREATE FINAL PRODUCTION PLAN
      # ============================================================

      - name: Create final production plan
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Production Plan"
          echo "========================================"
          echo "Environment   : production"
          echo "Variable file : environments/prod/terraform.tfvars"
          echo "Output file   : tfplan"
          echo "========================================"

          terraform plan \
            -var-file="environments/prod/terraform.tfvars" \
            -out="tfplan" \
            -no-color \
            2>&1 | tee terraform-plan.log

      # ============================================================
      # VERIFY PLAN
      # ============================================================

      - name: Verify Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "tfplan" ]; then
            echo "::error::Terraform plan file was not created."
            exit 1
          fi

          echo "Terraform production plan generated successfully."

          ls -lh tfplan

      # ============================================================
      # CONVERT PLAN TO JSON
      # ============================================================

      - name: Convert plan to JSON
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Convert Terraform Plan to JSON"
          echo "========================================"

          terraform show \
            -json tfplan \
            > tfplan.json

          if [ ! -s "tfplan.json" ]; then
            echo "::error::tfplan.json was not generated."
            exit 1
          fi

          ls -lh tfplan.json

      # ============================================================
      # CREATE HUMAN READABLE PLAN SUMMARY
      # ============================================================

      - name: Generate production plan summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Production Plan Summary"
          echo "========================================"

          if [ ! -f "scripts/terraform-plan-summary.py" ]; then
            echo "::error::scripts/terraform-plan-summary.py was not found."
            exit 1
          fi

          python scripts/terraform-plan-summary.py \
            tfplan.json \
            > production-plan-summary.md

          if [ ! -s "production-plan-summary.md" ]; then
            echo "::error::Production plan summary was not generated."
            exit 1
          fi

          cat production-plan-summary.md

      # ============================================================
      # GITHUB JOB SUMMARY
      # ============================================================

      - name: Add production plan to GitHub summary
        shell: bash
        run: |
          echo "# 🚀 Terraform Production Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Deployment Information | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | Production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | $GITHUB_REPOSITORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | $GITHUB_REF_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered By | $GITHUB_ACTOR |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 📋 Planned Infrastructure Changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          cat production-plan-summary.md >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 🛑 Production Approval Required" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the production plan above before approving the deployment." >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # UPLOAD EXACT PLAN FOR APPROVED APPLY JOB
      # ============================================================

      - name: Upload production plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: |
            tfplan
            tfplan.json
            production-plan-summary.md
            terraform-init.log
            terraform-validate.log
            terraform-plan.log
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # JOB 2
  # PRODUCTION APPROVAL + TERRAFORM APPLY
  # ============================================================

  apply:
    name: Approve and Apply Production
    runs-on: ubuntu-latest

    needs:
      - prepare-plan

    # IMPORTANT:
    # Configure required reviewers for the "production"
    # environment in GitHub repository settings.
    #
    # The job will stop here and wait for approval.
    environment:
      name: production

    steps:

      # ============================================================
      # CHECKOUT EXACT MERGED COMMIT
      # ============================================================

      - name: Checkout approved merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ============================================================
      # SETUP TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      # ============================================================
      # VERIFY REQUIRED APPLY VARIABLES
      # ============================================================

      - name: Verify required deployment variables
        shell: bash
        env:
          APPLY_ROLE_ARN: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Production Deployment Configuration"
          echo "========================================"

          if [ -z "$APPLY_ROLE_ARN" ]; then
            echo "::error::TERRAFORM_APPLY_ROLE_ARN is not configured."
            exit 1
          fi

          if [ -z "$STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET is not configured."
            exit 1
          fi

          echo "Terraform Apply role configured."
          echo "Terraform state bucket configured."
          echo "Environment : production"
          echo "Region      : $AWS_REGION"

      # ============================================================
      # AWS OIDC - APPLY ROLE
      # ============================================================

      - name: Configure AWS credentials for Terraform Apply
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-prod-apply-${{ github.run_id }}

      # ============================================================
      # VERIFY AWS IDENTITY
      # ============================================================

      - name: Verify AWS deployment identity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS Production Deployment Identity"
          echo "========================================"

          aws sts get-caller-identity

      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Init"
          echo "========================================"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            2>&1 | tee terraform-init-apply.log

      # ============================================================
      # DOWNLOAD EXACT PLAN CREATED BEFORE APPROVAL
      # ============================================================

      - name: Download approved production plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: .

      # ============================================================
      # VERIFY APPROVED PLAN
      # ============================================================

      - name: Verify approved Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Approved Terraform Plan"
          echo "========================================"

          if [ ! -s "tfplan" ]; then
            echo "::error::Approved tfplan artifact was not found."
            exit 1
          fi

          if [ ! -s "tfplan.json" ]; then
            echo "::error::Approved tfplan.json artifact was not found."
            exit 1
          fi

          echo "Approved Terraform plan is available."

          ls -lh tfplan tfplan.json

      # ============================================================
      # SHOW APPROVED PLAN SUMMARY
      # ============================================================

      - name: Show approved production plan
        shell: bash
        run: |
          echo "========================================"
          echo "Approved Production Plan"
          echo "========================================"

          if [ -f "production-plan-summary.md" ]; then
            cat production-plan-summary.md
          fi

      # ============================================================
      # APPLY EXACT APPROVED PLAN
      # ============================================================

      - name: Apply exact approved Terraform plan
        id: terraform_apply
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Production Apply"
          echo "========================================"
          echo "Environment : production"
          echo "Commit      : $GITHUB_SHA"
          echo "Triggered By: $GITHUB_ACTOR"
          echo "========================================"

          terraform apply \
            -auto-approve \
            tfplan \
            2>&1 | tee terraform-apply.log

      # ============================================================
      # CAPTURE TERRAFORM OUTPUTS
      # ============================================================

      - name: Capture Terraform outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Outputs"
          echo "========================================"

          terraform output \
            -json \
            > terraform-outputs.json

          if [ -s "terraform-outputs.json" ]; then
            echo "Terraform outputs captured successfully."
            ls -lh terraform-outputs.json
          else
            echo "{}" > terraform-outputs.json
            echo "Terraform produced no outputs."
          fi

      # ============================================================
      # VERIFY REPORTING SCRIPTS
      # ============================================================

      - name: Verify deployment report scripts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Deployment Report Scripts"
          echo "========================================"

          if [ ! -f "scripts/deployment-report.py" ]; then
            echo "::error::scripts/deployment-report.py was not found."
            exit 1
          fi

          if [ ! -f "scripts/send-email.py" ]; then
            echo "::error::scripts/send-email.py was not found."
            exit 1
          fi

          python --version

          echo ""
          echo "Required deployment reporting scripts found."

      # ============================================================
      # GENERATE SUCCESS DEPLOYMENT REPORT
      # ============================================================

      - name: Generate deployment reports
        if: success()
        shell: bash
        env:
          DEPLOY_ENV: production
          GIT_COMMIT: ${{ github.sha }}
          PIPELINE_RUN: ${{ github.run_id }}
          AWS_REGION: ${{ env.AWS_REGION }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generate Production Deployment Report"
          echo "========================================"

          python scripts/deployment-report.py \
            tfplan.json \
            terraform-outputs.json \
            --markdown deployment-report.md \
            --html deployment-report.html

          echo ""
          echo "Generated deployment reports:"

          ls -lh \
            deployment-report.md \
            deployment-report.html

      # ============================================================
      # SUCCESS JOB SUMMARY
      # ============================================================

      - name: Add deployment report to GitHub summary
        if: success()
        shell: bash
        run: |
          echo "# ✅ Terraform Production Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Deployment Information | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | Production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | $GITHUB_REPOSITORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | $GITHUB_REF_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered By | $GITHUB_ACTOR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | $GITHUB_RUN_ID |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          cat deployment-report.md >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # SUCCESS EMAIL
      # ============================================================

      - name: Send successful deployment email
        if: success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Sending Production Deployment Email"
          echo "========================================"

          python scripts/send-email.py \
            deployment-report.html \
            "Terraform AWS Deployment - SUCCESS - Production"

      # ============================================================
      # CREATE FAILURE EMAIL REPORT
      # ============================================================

      - name: Generate failure report
        if: failure()
        shell: bash
        run: |
          cat > deployment-failure.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <style>
              body {
                font-family: Arial, sans-serif;
                background: #f5f7fa;
                padding: 30px;
              }

              .container {
                max-width: 750px;
                margin: auto;
                background: white;
                border-radius: 10px;
                padding: 30px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
              }

              .failed {
                color: #b42318;
                font-size: 24px;
                font-weight: bold;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
              }

              td {
                padding: 10px;
                border-bottom: 1px solid #ddd;
              }

              td:first-child {
                font-weight: bold;
                width: 35%;
              }
            </style>
          </head>

          <body>
            <div class="container">

              <div class="failed">
                ❌ Terraform Production Deployment Failed
              </div>

              <p>
                The Terraform production deployment did not complete
                successfully.
              </p>

              <table>
                <tr>
                  <td>Environment</td>
                  <td>Production</td>
                </tr>

                <tr>
                  <td>Repository</td>
                  <td>${GITHUB_REPOSITORY}</td>
                </tr>

                <tr>
                  <td>Branch</td>
                  <td>${GITHUB_REF_NAME}</td>
                </tr>

                <tr>
                  <td>Commit</td>
                  <td>${GITHUB_SHA}</td>
                </tr>

                <tr>
                  <td>Triggered By</td>
                  <td>${GITHUB_ACTOR}</td>
                </tr>

                <tr>
                  <td>Workflow</td>
                  <td>${GITHUB_WORKFLOW}</td>
                </tr>

                <tr>
                  <td>Run ID</td>
                  <td>${GITHUB_RUN_ID}</td>
                </tr>
              </table>

              <p>
                Review the GitHub Actions workflow logs for the exact
                failure details.
              </p>

            </div>
          </body>
          </html>
          EOF

      # ============================================================
      # FAILURE JOB SUMMARY
      # ============================================================

      - name: Add failed deployment to GitHub summary
        if: failure()
        shell: bash
        run: |
          echo "# ❌ Terraform Production Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Deployment Information | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | Production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | $GITHUB_REPOSITORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered By | $GITHUB_ACTOR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ❌ FAILED |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the failed workflow step for detailed error information." >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # FAILURE EMAIL
      # ============================================================

      - name: Send failed deployment email
        if: failure()
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        shell: bash
        run: |
          if [ ! -f "scripts/send-email.py" ]; then
            echo "send-email.py unavailable. Skipping failure email."
            exit 0
          fi

          if [ ! -f "deployment-failure.html" ]; then
            echo "Failure report unavailable. Skipping failure email."
            exit 0
          fi

          python scripts/send-email.py \
            deployment-failure.html \
            "Terraform AWS Deployment - FAILED - Production"

      # ============================================================
      # UPLOAD DEPLOYMENT ARTIFACTS
      # ============================================================

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-deployment-${{ github.run_id }}
          path: |
            terraform-init-apply.log
            terraform-apply.log
            tfplan.json
            production-plan-summary.md
            terraform-outputs.json
            deployment-report.md
            deployment-report.html
            deployment-failure.html
          if-no-files-found: ignore