name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "scripts/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout approved and merged code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        shell: bash
        run: |
          set -o pipefail
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" 2>&1 | tee terraform-init.log

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Create final production plan
        run: |
          terraform plan \
            -var-file=environments/prod/terraform.tfvars \
            -out=tfplan -no-color
          terraform show -json tfplan > tfplan.json

      - name: Apply exact generated plan
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        if: success()
        run: terraform output -json > terraform-outputs.json

      - name: Generate deployment reports
        if: success()
        env:
          DEPLOY_ENV: production
          GIT_COMMIT: ${{ github.sha }}
          PIPELINE_RUN: ${{ github.run_id }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          python scripts/deployment-report.py \
            tfplan.json terraform-outputs.json \
            --markdown deployment-report.md \
            --html deployment-report.html

      - name: Add deployment report to job summary
        if: success()
        run: cat deployment-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send deployment email
        if: success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send-email.py deployment-report.html "Terraform AWS Deployment - SUCCESS - Production"

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deployment-report-${{ github.run_id }}
          path: |
            tfplan.json
            terraform-outputs.json
            deployment-report.md
            deployment-report.html
          if-no-files-found: ignore
